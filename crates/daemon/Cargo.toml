[package]
name = "wpe-daemon"
description = "Wallpaper renderer daemon (one window per monitor) with D-Bus API"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "wpe-daemon"
path = "src/main.rs"

[features]
default = []
# Real renderer (GTK4 + GStreamer + WebKitGTK 6). Needs the -dev packages from README.
gtk = ["dep:gtk4", "dep:webkit6", "dep:gstreamer"]

[dependencies]
we-core.workspace = true
serde.workspace = true
serde_json.workspace = true
zbus = "5"
gtk4 = { version = "0.11", optional = true, features = ["v4_14"] }
webkit6 = { version = "0.6", optional = true }
gstreamer = { version = "0.25", optional = true }

[dev-dependencies]
tempfile = "3"
