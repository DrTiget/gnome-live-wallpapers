<!doctype html>
<html><head><meta charset="utf-8"><style>
html,body{margin:0;height:100%;overflow:hidden;background:#000;font-family:sans-serif}
canvas{position:fixed;inset:0}
#hud{position:fixed;left:40px;bottom:60px;color:#fff;font-size:28px;text-shadow:0 2px 6px #000}
#log{font-size:16px;opacity:.8;margin-top:8px}
</style></head><body>
<canvas id="c"></canvas>
<div id="hud"><div id="msg">WPE web wallpaper</div><div id="fps" style="font-size:16px">fps</div><div id="log">waiting for applyUserProperties…</div></div>
<script>
const c = document.getElementById('c'), g = c.getContext('2d');
let W, H, color = [0.1, 0.5, 1], trail = true, speed = 1, t = 0, clicks = 0;
const pts = [], rings = [];
function resize() { W = c.width = innerWidth; H = c.height = innerHeight; }
addEventListener('resize', resize); resize();
const log = s => document.getElementById('log').textContent = s;
window.wallpaperPropertyListener = {
  applyUserProperties(p) {
    if (p.schemecolor) color = p.schemecolor.value.split(' ').map(Number);
    if (p.message) document.getElementById('msg').textContent = p.message.value;
    if (p.trail) trail = p.trail.value;
    if (p.speed) speed = p.speed.value;
    log('properties: ' + Object.keys(p).join(', '));
  },
  setPaused(paused) { log(paused ? 'paused' : 'resumed'); },
};
document.addEventListener('mousemove', e => { if (trail) pts.push({x: e.clientX, y: e.clientY, a: 1}); });
document.addEventListener('mousedown', e => {
  rings.push({x: e.clientX, y: e.clientY, r: 0});
  log(`mousedown #${++clicks} button=${e.button} at ${e.clientX|0},${e.clientY|0}`);
});
let bars = new Array(128).fill(0);
if (window.wallpaperRegisterAudioListener) window.wallpaperRegisterAudioListener(a => bars = a);
const rgb = a => `rgba(${color.map(x => x * 255 | 0).join(',')},${a})`;
let fc = 0, ft = performance.now();
function frame() {
  fc++; const now = performance.now(); if (now - ft > 1000) { document.getElementById("fps").textContent = "fps: " + Math.round(fc * 1000 / (now - ft)); fc = 0; ft = now; }
  t += 0.016 * speed;
  const grd = g.createLinearGradient(0, 0, W, H);
  grd.addColorStop(0, rgb(1)); grd.addColorStop(1, `hsl(${(t * 40) % 360},70%,15%)`);
  g.fillStyle = grd; g.fillRect(0, 0, W, H);
  for (let i = 0; i < 12; i++) {
    const x = W / 2 + Math.cos(t + i / 2) * W * 0.3, y = H / 2 + Math.sin(t * 1.3 + i) * H * 0.3;
    g.beginPath(); g.arc(x, y, 40 + 20 * Math.sin(t + i), 0, 7); g.fillStyle = 'rgba(255,255,255,.08)'; g.fill();
  }
  for (const p of pts) { g.beginPath(); g.arc(p.x, p.y, 12 * p.a, 0, 7); g.fillStyle = `rgba(255,255,255,${p.a})`; g.fill(); p.a -= 0.004; }
  while (pts.length && pts[0].a <= 0) pts.shift();
  for (const r of rings) { g.beginPath(); g.arc(r.x, r.y, r.r, 0, 7); g.strokeStyle = `rgba(255,220,80,${1 - r.r / 300})`; g.lineWidth = 6; g.stroke(); r.r += 1.5; }
  while (rings.length && rings[0].r > 300) rings.shift();
  const bw = W / 128;
  bars.forEach((v, i) => { g.fillStyle = 'rgba(255,255,255,.5)'; g.fillRect(i * bw, H - v * 200, bw - 2, v * 200); });
  requestAnimationFrame(frame);
}
frame();
</script></body></html>
